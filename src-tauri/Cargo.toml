[package]
name = "screeve"
version = "0.1.0"
description = "Editor per la scrittura creativa in italiano"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42.0"
tauri-plugin-dialog = "2.8.4"

# Eseguibile piccolo: è un'app portable da un solo file.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
